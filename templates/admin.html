{% extends "base.html" %} {% block content %}

<section class="products-section">
  <h1>АДМИН-ПАНЕЛЬ</h1>
  <p>Управление магазином MEN'S STYLE</p>

  <form method="POST" class="admin-form">
    <input type="text" name="name" placeholder="Название товара" required />

    <textarea
      name="description"
      placeholder="Описание товара"
      required
    ></textarea>

    <input
      type="number"
      name="price"
      placeholder="Цена в сомах"
      min="1"
      step="0.01"
      required
    />

    <input type="text" name="category" placeholder="Категория" required />

    <input type="text" name="size" placeholder="Размер" />

    <input
      type="text"
      name="image"
      placeholder="Имя фотографии, например tshirt.jpg"
    />

    <button type="submit" class="main-button">ДОБАВИТЬ ТОВАР</button>
  </form>

  <h2>ТОВАРЫ В МАГАЗИНЕ</h2>

  {% for product in products %}
  <div class="cart-item">
    <div>
      <h3>{{ product.name }}</h3>
      <p>{{ product.price }} сом</p>
      <p>{{ product.category }}</p>
    </div>

    <form
      method="POST"
      action="{{ url_for('delete_product', product_id=product.id) }}"
    >
      <button type="submit" class="delete-button">Удалить</button>
    </form>
  </div>
  {% else %}
  <p>Товаров пока нет.</p>
  {% endfor %}
</section>

{% endblock %}
